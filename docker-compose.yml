services:
  enowxai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enowxai-proxy
    restart: unless-stopped

    expose:
      - "1430"
      - "1431"

    volumes:
      - ./data:/root/.enowxai

    environment:
      - TZ=UTC

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1430/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      # Dashboard on dashboard.fahrenal.dev
      - "traefik.enable=true"
      - "traefik.http.routers.enowxai-dashboard.rule=Host(`dashboard.fahrenal.dev`)"
      - "traefik.http.routers.enowxai-dashboard.entrypoints=websecure"
      - "traefik.http.routers.enowxai-dashboard.tls=true"
      - "traefik.http.routers.enowxai-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.enowxai-dashboard.service=enowxai-dashboard"
      - "traefik.http.services.enowxai-dashboard.loadbalancer.server.port=1431"

    networks:
      - enowxai-network
      - dokploy-network

  enowxai-shim:
    build:
      context: ./shim
      dockerfile: Dockerfile
    container_name: enowxai-shim
    restart: unless-stopped

    depends_on:
      enowxai:
        condition: service_healthy

    expose:
      - "1432"

    environment:
      - SHIM_HOST=0.0.0.0
      - SHIM_PORT=1432
      - ENOWXAI_UPSTREAM=http://enowxai:1430/v1
      - SHIM_MAX_RETRIES=2

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1432/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    labels:
      # API on ai.fahrenal.dev
      - "traefik.enable=true"
      - "traefik.http.routers.enowxai-api.rule=Host(`ai.fahrenal.dev`)"
      - "traefik.http.routers.enowxai-api.entrypoints=websecure"
      - "traefik.http.routers.enowxai-api.tls=true"
      - "traefik.http.routers.enowxai-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.enowxai-api.service=enowxai-api"
      - "traefik.http.services.enowxai-api.loadbalancer.server.port=1432"

    networks:
      - enowxai-network
      - dokploy-network

networks:
  enowxai-network:
    driver: bridge
  dokploy-network:
    external: true
